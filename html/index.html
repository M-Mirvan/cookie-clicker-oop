<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doner Clicker</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/x-icon" href="/IMG/kebab.png">
</head>
<body>
    <div class="game-container">
        <!-- Left Panel -->
        <div class="left-panel">
            <img src="/IMG/Screenshot 2026-09-22 130947-Photoroom.png" id="clickDöner" alt="Doner">
        </div>

        <!-- Middle Panel -->
        <div class="middle-panel">
            <div class="middle-top-bar">
                <div class="nav-buttons-left">
                    <button id="options-btn" class="nav-btn">Options</button>
                    <button class="nav-btn">Stats</button>
                </div>
                
                <div class="info-box">
                    <p>Income: <span id="income">0</span> Doner/sec</p>
                    <p>Doner count: <span id="clickCount">0</span></p>
                    <p>Per click: <span id="clickPower">1</span></p>
                    <p>Global Multiplier: <span id="globalMultiplier" class="multiplier-text">x1.0</span> | Click Multiplier: <span id="clickMultiplier" class="multiplier-text">x1.0</span></p>
                </div>

                <div class="nav-buttons-right">
                    <button class="nav-btn">Info</button>
                    <button class="nav-btn">Legacy</button>
                </div>
            </div>

            <div class="shelves-container">
                <div class="shelf"></div>
                <div class="shelf"></div>
                <div class="shelf"></div>
                <div class="shelf"></div>
                <div class="shelf"></div>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="right-panel">
            <button id="theme-toggle">Dark Mode</button>
            <div id="events-banner"></div>
            <h2>Store</h2>
            <span class="upgrades_title">Upgrades</span>
            
            <div id="upgrades-list"></div> 
            
            <div class="buy-modes">
                <span>Buy / Sell</span>
                <div class="quantity-selectors">
                    <button>1</button>
                    <button>10</button>
                    <button>50</button>
                    <button>100</button>
                </div>
            </div>

            <div id="buildings-list" role="listbox" aria-label="Factories Shop"></div>
        </div>
    </div>

    <!-- Options Modal (Save / Load / Reset) -->
    <div id="options-modal" class="popup-modal">
        <div class="popup-content">
            <h3>Options</h3>
            <div class="save-controls">
                <button id="save-btn" class="control-btn">Save Game</button>
                <button id="load-btn" class="control-btn">Load Game</button>
                <button id="reset-btn" class="control-btn danger-btn">Reset Progress</button>
            </div>
            <button id="options-close-btn" class="control-btn close-btn">Close</button>
        </div>
    </div>

    <!-- Custom Popup Modal -->
    <div id="popup-modal" class="popup-modal">
        <div class="popup-content">
            <h3 id="popup-title">Niet genoeg Döner!</h3>
            <p id="popup-message"></p>
            <button id="popup-close-btn">Begrepen</button>
        </div>
    </div>

    <script type="module" src="/js/Main.js"></script>
</body>
</html>
